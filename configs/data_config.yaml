dataset:
  name: polyAI/banking77

schema:
  columns:
    text: string
    label: ClassLabel

size:
  train: 10003
  test: 3080

classification:
  num_classes: 77
  label_indexing: zero_based

split:
  tolerance: 0.01

text:
  min_length: 1

preprocessing:
  strip_whitespace: true
  remove_empty_text: true
  normalize_labels: true
  expected_num_classes: 77

analysis:
  generate_class_distribution: true
